<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRM SPI · Dauphine - PSL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4F6FB;--surface:#ffffff;--surface2:#F7F9FC;--surface3:#EEF2F8;
  --border:#E8ECF3;--border2:#D6DDE9;
  --text:#0F1B2D;--text2:#5A6B85;--text3:#94A2B8;
  --blue:#2F5FE0;--blue-light:#EAF0FE;--blue-dark:#2049BE;--blue-soft:#DCE6FD;
  --green:#0E9F6E;--green-light:#DEF7EC;
  --amber:#C2770C;--amber-light:#FDF6E3;
  --red:#E02424;--red-light:#FDE8E8;
  --purple:#7E3AF2;--purple-light:#EDEBFE;
  --teal:#0E9488;--teal-light:#DEF5F2;
  --navy:#0B1A33;
  --radius:10px;--radius-lg:16px;--radius-xl:20px;
  --shadow-sm:0 1px 2px rgba(15,27,45,.04),0 1px 3px rgba(15,27,45,.06);
  --shadow:0 4px 12px rgba(15,27,45,.06),0 2px 4px rgba(15,27,45,.04);
  --shadow-lg:0 12px 32px rgba(15,27,45,.10),0 4px 8px rgba(15,27,45,.05);
}
html,body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

/* LOGIN */
.login-wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 25% 15%,#162E54 0%,#0B1A33 55%,#070F1F 100%);position:relative;overflow:hidden;padding:20px}
.login-logo{text-align:center;margin-bottom:30px;position:relative;z-index:2}
.login-logo .org{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px;font-weight:600}
.login-logo .title{font-size:34px;font-weight:800;color:#fff;letter-spacing:-.02em}
.login-logo .sub{font-size:14px;color:rgba(255,255,255,.6);margin-top:6px}
.login-crest{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:18px}
.login-crest img{height:64px;width:auto;object-fit:contain;background:#fff;border-radius:14px;padding:9px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.login-crest .crest-x{color:rgba(255,255,255,.55);font-size:22px;font-weight:300}
.login-sails{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:1;opacity:.13;pointer-events:none;color:#9FC2F5}
.login-sails svg{width:100%;height:100%}
.sidebar-brand{display:flex;align-items:center;gap:9px}
.sidebar-crest{width:24px;height:24px;flex-shrink:0}
.sidebar-crest img{width:100%;height:100%;object-fit:contain;filter:brightness(0) invert(1);opacity:.92}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:var(--radius-xl);padding:36px;box-shadow:var(--shadow-lg);position:relative;z-index:2;animation:slideUp .5s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.login-card h2{font-size:19px;font-weight:700;margin-bottom:22px;color:var(--text)}

.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:7px}
.form-input,.form-select{width:100%;padding:11px 14px;font-size:14px;font-family:inherit;border:1.5px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text);outline:none;transition:all .18s}
.form-input:focus,.form-select:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-light)}
.form-input::placeholder{color:var(--text3)}
.form-select{cursor:pointer}
textarea.form-input{resize:vertical;min-height:84px;line-height:1.6}
.err-msg{font-size:13px;color:var(--red);background:var(--red-light);padding:10px 14px;border-radius:var(--radius);margin-bottom:14px;display:none;border:1px solid #FAD1D1}
.err-msg.show{display:block;animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;font-size:13px;font-weight:600;font-family:inherit;border-radius:var(--radius);cursor:pointer;border:1.5px solid var(--border2);background:var(--surface);color:var(--text);text-decoration:none;transition:all .18s;white-space:nowrap}
.btn:hover{background:var(--surface3);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 2px 8px rgba(47,95,224,.25)}
.btn-primary:hover{background:var(--blue-dark);border-color:var(--blue-dark)}
.btn-danger{color:var(--red);border-color:#F5C0C0}
.btn-danger:hover{background:var(--red-light)}
.btn-full{width:100%;padding:12px}
.btn svg{width:15px;height:15px;flex-shrink:0}

/* APP SHELL */
.app{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{background:linear-gradient(180deg,#0B1A33 0%,#0A1628 100%);display:flex;flex-direction:column;position:fixed;top:0;left:0;width:248px;height:100vh;height:100dvh;z-index:30;transition:transform .25s ease}
.sidebar-logo{padding:24px 22px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.sidebar-org{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px;font-weight:600}
.sidebar-name{font-size:17px;font-weight:700;color:#fff}
.sidebar-badge{display:inline-block;font-size:10px;background:var(--blue);color:#fff;border-radius:6px;padding:2px 9px;margin-top:8px;font-weight:600}
.nav{padding:16px 12px;flex:1;overflow-y:auto}
.nav-section{padding:16px 12px 8px;font-size:10px;color:rgba(255,255,255,.32);letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.62);cursor:pointer;border-radius:var(--radius);transition:all .16s;text-decoration:none;margin-bottom:2px}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-item.active{color:#fff;background:var(--blue);box-shadow:0 4px 12px rgba(47,95,224,.35)}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-badge{margin-left:auto;font-size:10px;background:rgba(255,255,255,.15);color:rgba(255,255,255,.85);border-radius:20px;padding:2px 8px;font-weight:600;min-width:22px;text-align:center}
.nav-item.active .nav-badge{background:rgba(255,255,255,.25);color:#fff}
.sidebar-user{padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:11px}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;background:var(--blue)}
.avatar-sm{width:32px;height:32px;font-size:11px}
.avatar-md{width:38px;height:38px;font-size:13px}
.avatar-lg{width:48px;height:48px;font-size:16px}
.user-name{font-size:12.5px;color:#fff;font-weight:600}
.user-role{font-size:10.5px;color:rgba(255,255,255,.45)}

/* MAIN */
.main{margin-left:248px;flex:1;display:flex;flex-direction:column;min-height:100vh;min-width:0}
.topbar{padding:16px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:20}
.topbar-title{font-size:19px;font-weight:700;color:var(--text);flex:1;min-width:0}
.menu-toggle{display:none;background:none;border:none;cursor:pointer;color:var(--text);padding:4px}
.menu-toggle svg{width:24px;height:24px}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text3);pointer-events:none}
.search-input{padding:9px 14px 9px 36px;font-size:13px;font-family:inherit;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--surface2);color:var(--text);outline:none;width:240px;transition:all .18s}
.search-input:focus{border-color:var(--blue);background:var(--surface);box-shadow:0 0 0 4px var(--blue-light)}
.content{padding:28px;flex:1;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* OVERLAY for mobile sidebar */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(11,26,51,.5);z-index:25}
.sidebar-overlay.show{display:block}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 22px;box-shadow:var(--shadow-sm);transition:all .2s;position:relative;overflow:hidden}
.stat-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stat-value{font-size:28px;font-weight:800;color:var(--text);letter-spacing:-.02em;line-height:1}
.stat-sub{font-size:12.5px;color:var(--text3);margin-top:8px;font-weight:500}
.stat-sub .pos{color:var(--green);font-weight:600}

/* DASHBOARD LAYOUT */
.dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section-title{font-size:15px;font-weight:700;color:var(--text)}
.pipeline-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}

/* BADGES */
.badge{display:inline-flex;align-items:center;font-size:11px;padding:3px 11px;border-radius:20px;font-weight:600;white-space:nowrap}
.badge-gray{background:var(--surface3);color:var(--text2)}
.badge-blue{background:var(--blue-light);color:var(--blue-dark)}
.badge-green{background:var(--green-light);color:#046C4E}
.badge-amber{background:var(--amber-light);color:#8A5608}
.badge-red{background:var(--red-light);color:#9B1C1C}
.badge-purple{background:var(--purple-light);color:#6028C5}
.badge-teal{background:var(--teal-light);color:#0B6B62}

/* TABLE */
.table-wrap{border:1px solid var(--border);border-radius:var(--radius-lg);overflow-x:auto;background:var(--surface);box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:600px}
thead th{text-align:left;font-size:11px;font-weight:700;color:var(--text2);padding:13px 18px;border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
tbody tr{border-bottom:1px solid var(--border);transition:background .14s;cursor:pointer}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--blue-light)}
tbody td{padding:14px 18px;vertical-align:middle}

/* FILTERS */
.filters-bar{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-items:center}
.filter-btn{font-size:12.5px;font-family:inherit;font-weight:500;padding:7px 15px;border-radius:24px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .16s;white-space:nowrap}
.filter-btn:hover{border-color:var(--blue-soft);color:var(--text)}
.filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}

/* KANBAN */
.kanban{display:grid;gap:14px}
.kanban-col{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;min-height:120px}
.kanban-col-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.06em}
.kanban-count{background:var(--surface);color:var(--text2);border:1px solid var(--border);border-radius:20px;padding:1px 9px;font-size:10px;font-weight:600}
.kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:all .16s;box-shadow:var(--shadow-sm)}
.kanban-card:hover{border-color:var(--blue);box-shadow:var(--shadow);transform:translateY(-2px)}
.kanban-card-name{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:4px}
.kanban-card-sub{font-size:11px;color:var(--text3);font-weight:500}

/* CARDS GRID */
.cards-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm)}
.card:hover{border-color:var(--blue-soft);box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.event-mini{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:all .16s;box-shadow:var(--shadow-sm)}
.event-mini:hover{border-color:var(--blue-soft);box-shadow:var(--shadow)}
.event-date-box{width:42px;height:42px;background:var(--blue-light);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.event-date-box .m{font-size:9px;color:var(--blue-dark);text-transform:uppercase;font-weight:700}
.event-date-box .d{font-size:16px;font-weight:800;color:var(--blue-dark);line-height:1}

/* DETAIL */
.detail-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.detail-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.detail-section-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px}
.detail-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:10px 0;border-bottom:1px solid var(--border)}
.detail-row:last-child{border-bottom:none}
.detail-key{font-size:13px;color:var(--text2);flex-shrink:0;font-weight:500}
.detail-val{font-size:13px;color:var(--text);font-weight:600;text-align:right;word-break:break-word}

/* TIMELINE */
.timeline{display:flex;flex-direction:column;gap:0}
.timeline-item{display:flex;gap:14px;padding-bottom:16px;position:relative}
.timeline-item:not(:last-child)::before{content:'';position:absolute;left:5px;top:16px;bottom:0;width:2px;background:var(--border)}
.timeline-dot{width:12px;height:12px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:3px;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--blue)}
.timeline-dot.gray{background:var(--border2);box-shadow:0 0 0 1px var(--border2)}
.timeline-body{flex:1;min-width:0}
.timeline-text{font-size:13px;color:var(--text);line-height:1.5}
.timeline-date{font-size:11.5px;color:var(--text3);margin-top:3px;font-weight:500}

/* PROGRESS */
.progress-bar{height:8px;background:var(--surface3);border-radius:10px;overflow:hidden;margin-bottom:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue) 0%,var(--purple) 100%);border-radius:10px;transition:width .6s cubic-bezier(.16,1,.3,1)}
.pipeline-steps{display:flex;gap:4px;margin-bottom:6px}
.pipeline-step{flex:1;height:6px;border-radius:10px;transition:background .3s}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(11,26,51,.55);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex;animation:fadeIn .2s}
.modal{background:var(--surface);border-radius:var(--radius-xl);padding:30px;width:540px;max-width:100%;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.16,1,.3,1)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.modal-title{font-size:18px;font-weight:700;color:var(--text)}
.modal-close{cursor:pointer;color:var(--text3);padding:6px;border-radius:8px;line-height:1;border:none;background:none;font-size:16px;transition:all .15s}
.modal-close:hover{color:var(--text);background:var(--surface3)}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group.full{grid-column:1/-1}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text3);font-size:13.5px;gap:12px;font-weight:500}
.spinner{width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 24px;color:var(--text3)}
.empty svg{width:44px;height:44px;margin:0 auto 14px;display:block;opacity:.35}
.empty p{font-size:13.5px;font-weight:500}

/* VIEW TOGGLE */
.view-toggle{display:flex;border:1.5px solid var(--border2);border-radius:var(--radius);overflow:hidden}
.view-btn{padding:7px 12px;font-size:12px;cursor:pointer;background:var(--surface);color:var(--text2);border:none;display:flex;align-items:center;transition:all .15s}
.view-btn:hover{background:var(--surface3)}
.view-btn.active{background:var(--blue);color:#fff}
.view-btn svg{width:15px;height:15px}

/* AVATAR STACK */
.avatar-stack{display:flex}
.avatar-stack .avatar{border:2.5px solid var(--surface);margin-left:-9px}
.avatar-stack .avatar:first-child{margin-left:0}

/* KPI ROW */
.kpi-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:24px}

/* TEAM GRID */
.team-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pole-block{margin-bottom:26px}
.pole-header{display:flex;align-items:center;gap:9px;margin-bottom:13px;padding-bottom:9px;border-bottom:2px solid var(--pole-color,#e5e7eb)}
.pole-chip{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.pole-title{font-size:15px;font-weight:700;color:var(--text)}
.pole-count{font-size:12px;font-weight:600;color:#fff;background:var(--pole-color,#94a3b8);border-radius:10px;padding:1px 9px}
.resp-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex-shrink:0;vertical-align:middle}
.reassign-btn{display:inline-flex;align-items:center;font-size:12px;font-weight:600;color:var(--text);background:var(--surface2,#f1f5f9);border:1px solid var(--border);border-radius:8px;padding:4px 9px;cursor:pointer;transition:all .15s;white-space:nowrap}
.reassign-btn:hover{background:#fff;border-color:var(--blue);color:var(--blue)}
.reassign-list{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow-y:auto}
.reassign-option{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;transition:all .15s;text-align:left;width:100%}
.reassign-option:hover{border-color:var(--blue);background:#f8fafc}
.reassign-option.selected{border-color:var(--green);background:#f0fdf4}
.team-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;display:flex;gap:16px;align-items:flex-start;box-shadow:var(--shadow-sm);transition:all .2s}
.team-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}

/* WELCOME BANNER — Régate SPI */
.welcome-banner{position:relative;overflow:hidden;margin-bottom:24px;padding:26px 30px;padding-right:172px;border-radius:var(--radius-lg);color:#fff;background:linear-gradient(118deg,#0A2A57 0%,#123E7E 46%,#1B5AB0 100%);box-shadow:0 12px 32px rgba(10,38,82,.34),inset 0 1px 0 rgba(255,255,255,.07)}
.welcome-banner::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 150% at 10% -15%,rgba(125,175,245,.32),transparent 55%);pointer-events:none}
.welcome-banner::after{content:'';position:absolute;right:-70px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.05);pointer-events:none}
.welcome-banner>*{position:relative;z-index:1}
.welcome-sails{position:absolute;right:132px;top:0;bottom:0;width:52%;opacity:.20;pointer-events:none;color:#CFE0FB;z-index:0}
.welcome-sails svg{width:100%;height:100%}
.welcome-kicker{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(201,222,255,.82);margin-bottom:10px}
.welcome-kicker::before{content:'';width:20px;height:2px;border-radius:2px;background:linear-gradient(90deg,#E3BC52,rgba(227,188,82,0))}
.welcome-greeting{font-size:23px;font-weight:800;letter-spacing:-.01em;margin-bottom:3px}
.welcome-date{font-size:13px;color:rgba(214,228,255,.78);text-transform:capitalize}
.welcome-summary{font-size:14px;color:rgba(233,241,255,.94);margin-top:13px;font-weight:500;line-height:1.55}
.welcome-summary strong{font-weight:800;color:#fff}
.welcome-medal{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:106px;height:106px;border-radius:50%;z-index:3;background:radial-gradient(circle at 50% 36%,#ffffff 0%,#eef3fb 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px rgba(6,24,54,.42),0 0 0 1px rgba(255,255,255,.55),0 0 0 7px rgba(255,255,255,.09);pointer-events:none}
.welcome-medal img{width:82%;height:82%;object-fit:contain}
@media (max-width:680px){
  .welcome-banner{padding-right:30px}
  .welcome-sails{right:0;width:72%;opacity:.15}
  .welcome-medal{width:76px;height:76px;right:18px;box-shadow:0 8px 20px rgba(6,24,54,.40),0 0 0 1px rgba(255,255,255,.5)}
  .welcome-greeting{font-size:20px}
}
@media (max-width:440px){ .welcome-medal{display:none} }

/* DONUT CHART */
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.donut{position:relative;width:140px;height:140px;flex-shrink:0}
.donut svg{transform:rotate(-90deg)}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-center .num{font-size:26px;font-weight:800;color:var(--text);line-height:1}
.donut-center .lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:140px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend-label{color:var(--text2);flex:1}
.legend-val{font-weight:700;color:var(--text)}

/* MINI BARS (responsable breakdown) */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px}
.bar-name{width:80px;flex-shrink:0;font-weight:600;color:var(--text2)}
.bar-track{flex:1;height:8px;background:var(--surface3);border-radius:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:10px;transition:width .6s cubic-bezier(.16,1,.3,1)}
.bar-val{width:28px;text-align:right;font-weight:700;color:var(--text)}

.dash-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm);margin-bottom:20px}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:14px 22px;border-radius:var(--radius);font-size:13.5px;font-weight:500;z-index:1000;opacity:0;transform:translateY(12px);transition:all .28s;pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:var(--red)}

/* ============ RESPONSIVE ============ */
@media (max-width:1100px){
  .dash-grid{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pipeline-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi-row{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}
  .cards-grid{grid-template-columns:1fr}
  .team-grid{grid-template-columns:1fr}
}
@media (max-width:820px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .menu-toggle{display:block}
  .topbar{padding:14px 16px}
  .content{padding:16px}
  .search-input{width:140px}
  .search-input:focus{width:160px}
  .topbar-title{font-size:17px}
}
@media (max-width:520px){
  .stats-grid{grid-template-columns:1fr 1fr;gap:10px}
  .stat-card{padding:14px 16px}
  .stat-value{font-size:22px}
  .pipeline-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .modal{padding:22px}
  .search-wrap{display:none}
  .login-card{padding:26px}
}
</style>

let currentUser = null;

let currentSubTab = 'list';

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const statusLabels = {
  new:'Nouveau', contacted:'Contacté', 'in-process':'En cours', qualified:'Qualifié', negotiation:'Négociation',
  'closed-won':'Signé', 'closed-lost':'Perdu',
  planned:'Planifié', ongoing:'En cours', done:'Terminé', cancelled:'Annulé',
  contact:'Contact', proposal:'Proposition', signed:'Signé', lost:'Perdu'
};
const statusBadge = {
  new:'badge-gray', contacted:'badge-blue', 'in-process':'badge-teal', qualified:'badge-purple', negotiation:'badge-amber',
  'closed-won':'badge-green', 'closed-lost':'badge-red',
  planned:'badge-blue', ongoing:'badge-amber', done:'badge-green', cancelled:'badge-red',
  contact:'badge-gray', proposal:'badge-blue', signed:'badge-green', lost:'badge-red'
};
const packageColors = { Platinum:'badge-purple', Gold:'badge-amber', Silver:'badge-gray', Bronze:'badge-blue' };

function badge(status) {
  return `<span class="badge ${statusBadge[status]||'badge-gray'}">${statusLabels[status]||status}</span>`;
}
const mailLabels = { none:'—', 'to-send':'À envoyer', sent:'Envoyé' };
const mailBadgeClass = { none:'badge-gray', 'to-send':'badge-amber', sent:'badge-green' };
function mailBadge(ms) {
  const m = ms || 'none';
  if (m === 'none') return '<span style="color:var(--text3);font-size:12px">—</span>';
  return `<span class="badge ${mailBadgeClass[m]}">${mailLabels[m]}</span>`;
}
function pkgBadge(p) {
  return `<span class="badge ${packageColors[p]||'badge-gray'}">${p}</span>`;
}
function memberAvatar(m, size='sm') {
  if (!m) return `<div class="avatar avatar-${size}" style="background:#9ca3af">?</div>`;
  return `<div class="avatar avatar-${size}" style="background:${m.color||'#2563EB'}" title="${m.name}">${m.initials||m.name.slice(0,2).toUpperCase()}</div>`;
}
function memberByInitials(init) { return cache.team.find(t => t.initials === init); }
function memberById(id) { return cache.team.find(t => t.id === id); }
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('fr-FR'); }
function fmtAmt(n) { return (n||0).toLocaleString('fr-FR') + ' €'; }

function toast(msg, err=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (err ? ' error' : '');
  setTimeout(() => el.className = 'toast', 3000);
}

// ─── AUTH ────────────────────────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');

  if (pass !== APP_PASSWORD) { err.classList.add('show'); return; }
  if (!email) { err.classList.add('show'); return; }

  btn.disabled = true; btn.textContent = 'Connexion...';
  err.classList.remove('show');

  const { data, error } = await sb.from('team').select('*').eq('email', email).maybeSingle();
  if (error || !data) {
    err.textContent = 'Email non trouvé dans l\'équipe SPI.';
    err.classList.add('show');
    btn.disabled = false; btn.innerHTML = '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:15px;height:15px"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg> Se connecter';
    return;
  }

  currentUser = data;
  sessionStorage.setItem('spi_user', JSON.stringify(data));
  showApp();
}

document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function doLogout() {
  sessionStorage.removeItem('spi_user');
  currentUser = null;
  document.getElementById('appPage').style.display = 'none';
  document.getElementById('loginPage').style.display = '';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPass').value = '';
}

function showApp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').style.display = '';

  const u = currentUser;
  document.getElementById('sideAvatar').textContent = u.initials || u.name.slice(0,2).toUpperCase();
  document.getElementById('sideAvatar').style.background = u.color || '#2563EB';
  document.getElementById('sideUserName').textContent = u.name;
  document.getElementById('sideUserRole').textContent = u.role === 'admin' ? 'Administrateur·rice' : 'Membre';
  document.getElementById('sideRoleBadge').textContent = u.role === 'admin' ? 'Admin' : 'Membre';

  if (u.role !== 'admin') {
    document.getElementById('nav-team').style.opacity = '.4';
    document.getElementById('nav-team').style.pointerEvents = 'none';
  }
  nav('dashboard');
}

// Check existing session
window.addEventListener('DOMContentLoaded', () => {
  const saved = sessionStorage.getItem('spi_user');
  if (saved) {
    try { currentUser = JSON.parse(saved); showApp(); } catch(e) {}
  }
});

// ─── NAVIGATION ──────────────────────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

  const actions = {
    prospects: exportBtns('prospects') + `<button class="btn btn-primary" onclick="openModal('prospect')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg> Ajouter</button>`,
    events: `<button class="btn btn-primary" onclick="openModal('event')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg> Créer</button>`,
    sponsors: exportBtns('sponsors') + `<button class="btn btn-primary" onclick="openModal('sponsor')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg> Ajouter</button>`,
    crews: exportBtns('crews') + `<button class="btn btn-primary" onclick="openModal('crew')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg> Ajouter</button>`,
    team: isAdmin ? `<button class="btn btn-primary" onclick="openModal('member')"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg> Inviter</button>` : '',
    dashboard: ''
  };
  document.getElementById('topActions').innerHTML = actions[view] || '';
  document.getElementById('topActions').style.display = 'flex';
  document.getElementById('topActions').style.gap = '8px';
  document.getElementById('topActions').style.flexWrap = 'wrap';
  document.getElementById('searchInput').value = '';

  loadView(view);
}

async function loadView(view) {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="loading"><div class="spinner"></div> Chargement...</div>';
  await loadCache(view);
  if (view === 'dashboard') renderDashboard(c);
  else if (view === 'prospects') renderProspects(c);
  else if (view === 'events') renderEvents(c);
  else if (view === 'sponsors') renderSponsors(c);
  else if (view === 'crews') renderCrews(c);
  else if (view === 'team') renderTeam(c);
}

async function loadCache(view) {
  const [team] = await Promise.all([sb.from('team').select('*').order('name')]);
  cache.team = team.data || [];

  if (view === 'dashboard' || view === 'prospects') {
    const r = await sb.from('prospects').select('*, assignee:assignee_id(*)').order('created_at', { ascending: false });
    cache.prospects = r.data || [];
  }
  if (view === 'dashboard' || view === 'events') {
    const r = await sb.from('events').select('*').order('date');
    cache.events = r.data || [];
  }
  if (view === 'dashboard' || view === 'sponsors') {
    const r = await sb.from('sponsors').select('*, prospect:prospect_id(*), assignee:assignee_id(*)').order('created_at', { ascending: false });
    cache.sponsors = r.data || [];
  }
  if (view === 'crews' || view === 'dashboard') {
    const r = await sb.from('crews').select('*').order('name');
    cache.crews = r.data || [];
  }
  // Update nav badges
  document.getElementById('badgeProspects').textContent = cache.prospects.length || '—';
  document.getElementById('badgeEvents').textContent = cache.events.length || '—';
  document.getElementById('badgeSponsors').textContent = cache.sponsors.length || '—';
  const bc = document.getElementById('badgeCrews');
  if (bc && cache.crews) bc.textContent = cache.crews.length || '—';
}

function renderDashboard(c) {
  const won = cache.prospects.filter(p => p.status === 'closed-won').length;

  const totalPipe = cache.sponsors.filter(s => !['signed','lost'].includes(s.status)).reduce((a,b) => a + (b.amount||0), 0);
  const upcoming = cache.events.filter(e => e.status !== 'done' && e.status !== 'cancelled');
  const crews = cache.crews || [];

  // Crew stats
  const totalPart = crews.reduce((a,b)=>{const n=parseInt(b.participants);return a+(isNaN(n)?0:n);},0);
  const withBoat = crews.filter(x=>x.boat && /oui|ok|good|essaye|skipper/i.test(x.boat)).length;

  // Crew "chaud" detection from comments
  const chauds = crews.filter(x=>/chaud|sont chauds/i.test((x.comment||'')+(x.availability||''))).length;

  // Breakdown by responsable
  const respCounts = {};

    {label:'Sans bateau', val:noBoat, color:'#D6DDE9'},

  let offset = 0;

<path d="M398 128 L398 22 L330 128 Z"/><path d="M408 128 L408 52 L470 128 Z" opacity="0.65"/>
<path d="M520 118 L520 50 L476 118 Z"/><path d="M528 118 L528 66 L566 118 Z" opacity="0.65"/>
</g>
<path d="M150 128 L320 128 L300 140 L168 140 Z" fill="currentColor" opacity="0.5"/>
<path d="M310 134 L490 134 L470 146 L328 146 Z" fill="currentColor" opacity="0.5"/>
<path d="M0 132 Q150 124 300 132 T600 132" stroke="currentColor" stroke-width="2" fill="none" opacity="0.55"/>
<path d="M0 144 Q150 137 300 144 T600 144" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.4"/>
<path d="M0 154 Q150 148 300 154 T600 154" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.28"/>
</svg></div>
    <div class="welcome-medal"><img src="${LOGO_SPI_EMBLEM}" alt="Challenge SPI Dauphine"></div>
    <div class="welcome-kicker">Challenge SPI Dauphine</div>
    <div class="welcome-greeting">${greet} ${firstName} 👋</div>
    <div class="welcome-date">${dateStr}</div>
    <div class="welcome-summary"><strong>${crews.length}</strong> équipages suivis · <strong>${totalPart}+</strong> participants estimés · <strong>${fmtAmt(totalSigned)}</strong> de budget sécurisé${chauds?` · <strong>${chauds}</strong> équipages chauds 🔥`:''}</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Équipages</div><div class="stat-value">${crews.length}</div><div class="stat-sub"><span class="pos">${withBoat} avec bateau</span></div></div>
    <div class="stat-card"><div class="stat-label">Participants estimés</div><div class="stat-value">${totalPart}+</div><div class="stat-sub">tous équipages</div></div>
    <div class="stat-card"><div class="stat-label">Budget sécurisé</div><div class="stat-value">${fmtAmt(totalSigned)}</div><div class="stat-sub"><span class="pos">${fmtAmt(totalPipe)} en négo</span></div></div>
    <div class="stat-card"><div class="stat-label">Entreprises</div><div class="stat-value">${cache.prospects.length}</div><div class="stat-sub">${inPipe} en pipeline</div></div>
  </div>

  <div class="dash-grid">
    <div>
      <div class="dash-card">
        <div class="section-head" style="margin-bottom:18px">
          <div class="section-title">Suivi des équipages</div>
          <button class="btn" style="font-size:12px;padding:7px 12px" onclick="nav('crews')">Voir tout →</button>
        </div>
        <div class="donut-wrap">
          <div class="donut">
            <svg width="140" height="140" viewBox="0 0 140 140">${donutCircles}</svg>
            <div class="donut-center"><div class="num">${crews.length}</div><div class="lbl">équipages</div></div>
          </div>
          <div class="legend">
            ${donutSegments.map(s=>`<div class="legend-item"><span class="legend-dot" style="background:${s.color}"></span><span class="legend-label">${s.label}</span><span class="legend-val">${s.val}</span></div>`).join('')}
          </div>
        </div>
      </div>
      <div class="dash-card">
        <div class="section-title" style="margin-bottom:16px">Équipages par responsable</div>
        ${Object.entries(respCounts).sort((a,b)=>b[1]-a[1]).map(([r,n])=>`
        <div class="bar-row">
          <div class="bar-name">${r}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${n/maxResp*100}%;background:${respColors[r]||'#94A2B8'}"></div></div>
          <div class="bar-val">${n}</div>

      <div class="dash-card">

          <button class="btn" style="font-size:12px;padding:7px 12px" onclick="nav('prospects')">Voir tout →</button>
        </div>
        <div class="pipeline-grid">
          ${['new','contacted','in-process','qualified','negotiation'].map(st => `

              <div class="kanban-card-sub">${p.sector||''}</div>
            </div>`).join('')}
          </div>`).join('')}
        </div>
      </div>
    </div>
    <div>
      <div class="dash-card">
        <div class="section-title" style="margin-bottom:14px">Prochains événements</div>
        ${upcoming.slice(0,4).map(ev => `
        <div class="event-mini" onclick="nav('events')">
          <div class="event-date-box">
            <div class="m">${ev.date?['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'][new Date(ev.date).getMonth()]:''}</div>
            <div class="d">${ev.date?new Date(ev.date).getDate():''}</div>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ev.name}</div>

      </div>
      <div class="dash-card">
        <div class="section-title" style="margin-bottom:12px">Sponsorings récents</div>
        ${cache.sponsors.slice(0,5).map(s => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px">
          <div>
            <div style="font-weight:700;color:var(--text);margin-bottom:3px">${s.prospect?.name||'—'}</div>

    </div>
  </div>`;
}

// ─── PROSPECTS ───────────────────────────────────────────────────────────────
function renderProspects(c, data) {
  const prospects = data || cache.prospects;
  const counts = {};
  ['all','new','contacted','in-process','qualified','negotiation','closed-won','closed-lost'].forEach(s => {
    counts[s] = s === 'all' ? prospects.length : prospects.filter(p=>p.status===s).length;
  });
  const filtered = currentFilter === 'all' ? prospects : prospects.filter(p => p.status === currentFilter);

  const filtersHtml = `<div class="filters-bar">
    ${Object.entries({all:'Tous',new:'Nouveaux',contacted:'Contactés','in-process':'En cours',qualified:'Qualifiés',negotiation:'Négociation','closed-won':'Signés','closed-lost':'Perdus'}).map(([k,l])=>
      `<button class="filter-btn${currentFilter===k?' active':''}" onclick="setFilter('${k}')">${l} (${counts[k]})</button>`
    ).join('')}
    <div class="view-toggle" style="margin-left:auto">
      <button class="view-btn${currentSubTab==='list'?' active':''}" onclick="setSubTab('list')" title="Vue liste"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg></button>
      <button class="view-btn${currentSubTab==='kanban'?' active':''}" onclick="setSubTab('kanban')" title="Vue kanban"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"/></svg></button>
    </div>
  </div>`;

  c.innerHTML = filtersHtml + (currentSubTab === 'list' ? renderProspectTable(filtered) : renderProspectKanban(filtered));
}

function renderProspectTable(list) {
  if (!list.length) return `<div class="empty"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16"/></svg><p>Aucune entreprise trouvée</p></div>`;
  return `<div class="table-wrap"><table>
    <thead><tr><th>Entreprise</th><th>Secteur</th><th>Contact</th><th>Statut</th><th>Mail</th><th>Source</th><th>Responsable</th><th>Dernière action</th></tr></thead>
    <tbody>${list.map(p=>`<tr onclick="showProspect('${p.id}')">
      <td><strong>${p.name}</strong></td>
      <td style="color:var(--text2)">${p.sector||'—'}</td>
      <td>${p.contact||'—'}</td>
      <td>${badge(p.status)}</td>
      <td>${mailBadge(p.mail_status)}</td>
      <td style="color:var(--text2)">${p.source||'—'}</td>
      <td>${memberAvatar(p.assignee)}</td>
      <td style="color:var(--text2)">${fmtDate(p.last_action_at)}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function renderProspectKanban(list) {
  return `<div class="kanban" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
    ${['new','contacted','in-process','qualified','negotiation','closed-won','closed-lost'].map(st=>`
    <div class="kanban-col">
      <div class="kanban-col-title">${statusLabels[st]}<span class="kanban-count">${list.filter(p=>p.status===st).length}</span></div>
      ${list.filter(p=>p.status===st).map(p=>`<div class="kanban-card" onclick="showProspect('${p.id}')">
        <div class="kanban-card-name">${p.name}</div>
        <div class="kanban-card-sub">${p.sector||''}</div>
      </div>`).join('')}
    </div>`).join('')}
  </div>`;
}

function setFilter(f) { currentFilter = f; renderProspects(document.getElementById('content')); }
function setSubTab(t) { currentSubTab = t; renderProspects(document.getElementById('content')); }

      <div>
        <div style="font-size:11px;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em">${ev.type||''} · ${ev.date||''}</div>
        <div style="font-size:15px;font-weight:700">${ev.name}</div>

const crewStatusMap = {
  contact:{l:'Contact',c:'badge-gray'},
  sur:{l:'Sûr',c:'badge-green'},
  probable:{l:'Très probable',c:'badge-blue'},
  doute:{l:'Doute',c:'badge-amber'},
  improbable:{l:'Peu probable',c:'badge-red'},
  refus:{l:'Refus',c:'badge-red'},
  nouveau:{l:'Nouveau',c:'badge-purple'}
};
function crewBadge(s){const m=crewStatusMap[s]||crewStatusMap.contact;return `<span class="badge ${m.c}">${m.l}</span>`;}

let crewFilter = 'all';

function renderCrews(c) {
  const crews = cache.crews || [];
  const totalPart = crews.reduce((a,b)=>{const n=parseInt(b.participants);return a+(isNaN(n)?0:n);},0);
  const responsables = [...new Set(crews.map(x=>x.responsable).filter(Boolean))].sort();

  const filtered = crewFilter === 'all' ? crews : crews.filter(x=>x.responsable===crewFilter);

  const groups = {};
  filtered.forEach(cr=>{const r=cr.responsable||'Non attribué';(groups[r]=groups[r]||[]).push(cr);});

  c.innerHTML = `
  <div class="kpi-row" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    <div class="stat-card"><div class="stat-label">Équipages suivis</div><div class="stat-value">${crews.length}</div><div class="stat-sub">${responsables.length} responsables</div></div>
    <div class="stat-card"><div class="stat-label">Participants estimés</div><div class="stat-value">${totalPart}+</div><div class="stat-sub">tous équipages confondus</div></div>
    <div class="stat-card"><div class="stat-label">Avec bateau</div><div class="stat-value">${crews.filter(x=>x.boat && /oui|ok|good|essaye|skipper/i.test(x.boat)).length}</div><div class="stat-sub">bateau confirmé ou en cours</div></div>
  </div>
  <div class="filters-bar">
    <button class="filter-btn${crewFilter==='all'?' active':''}" onclick="setCrewFilter('all')">Tous (${crews.length})</button>
    ${responsables.map(r=>`<button class="filter-btn${crewFilter===r?' active':''}" onclick="setCrewFilter('${r.replace(/'/g,"\\'")}')"><span class="resp-dot" style="background:${crewColor(r)}"></span>${r} (${crews.filter(x=>x.responsable===r).length})</button>`).join('')}
  </div>
  ${Object.keys(groups).sort().map(resp=>{
    const col = crewColor(resp);
    return `<div class="pole-block" style="--pole-color:${col}">
      <div class="pole-header">
        <span class="pole-chip" style="background:${col}"></span>
        <span class="pole-title">${resp}</span>
        <span class="pole-count">${groups[resp].length}</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Équipage</th><th>Contact</th><th>Particip.</th><th>Bateau</th><th>Disponibilité</th><th>Responsable</th></tr></thead>
          <tbody>
            ${groups[resp].map(cr=>`<tr>
              <td onclick="showCrew('${cr.id}')" style="cursor:pointer"><strong>${cr.name}</strong></td>
              <td onclick="showCrew('${cr.id}')" style="color:var(--blue);font-size:12.5px;cursor:pointer">${cr.contact||'—'}</td>
              <td style="font-weight:600">${cr.participants||'—'}</td>
              <td style="font-size:12px;color:var(--text2)">${cr.boat||'—'}</td>
              <td style="font-size:12px;color:var(--text2);max-width:150px">${cr.availability||'—'}</td>
              <td><button class="reassign-btn" onclick="reassignCrew('${cr.id}')" title="Changer le responsable"><span class="resp-dot" style="background:${crewColor(cr.responsable)}"></span>${cr.responsable||'Attribuer'}<svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="margin-left:4px"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg></button></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }).join('') || '<div class="empty"><p>Aucun équipage</p></div>'}`;
}

function crewColor(name) {
  if (!name) return '#94a3b8';
  const m = (cache.team||[]).find(t => t.name === name || t.name.split(' ')[0] === name);
  return m?.color || '#64748B';
}

function kecMembers() {
  return (cache.team||[]).filter(t => (t.poste||'').toUpperCase() === 'KEC');
}

function reassignCrew(id) {
  const cr = (cache.crews||[]).find(x=>x.id===id);
  if (!cr) return;
  const members = kecMembers();
  document.getElementById('modalTitle').textContent = "Attribuer l'équipage";
  document.getElementById('modalBody').innerHTML = `
  <div style="font-size:13px;color:var(--text2);margin-bottom:14px">Équipage <strong>${cr.name}</strong> — choisir le responsable KEC :</div>
  <div class="reassign-list">
    ${members.map(m=>`<button class="reassign-option${cr.responsable===m.name?' selected':''}" onclick="doReassign('${id}','${m.name.replace(/'/g,"\\'")}')">
      <span class="avatar" style="background:${m.color};width:30px;height:30px;font-size:11px">${m.initials}</span>
      <div style="flex:1;text-align:left"><div style="font-weight:600;font-size:13px">${m.name}</div><div style="font-size:11px;color:var(--text3)">${cr.responsable===m.name?'Responsable actuel':'Cliquer pour attribuer'}</div></div>
      ${cr.responsable===m.name?'<svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="var(--green)" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>':''}
    </button>`).join('')}
    <button class="reassign-option" onclick="doReassign('${id}','')" style="opacity:.7"><span class="avatar" style="background:#94a3b8;width:30px;height:30px;font-size:11px">—</span><div style="flex:1;text-align:left"><div style="font-weight:600;font-size:13px">Non attribué</div></div></button>
  </div>`;
  const sv = document.getElementById('modalSaveBtn'); if (sv) sv.style.display = 'none';
  document.getElementById('modalOverlay').classList.add('show');
}

async function doReassign(id, name) {
  const sv = document.getElementById('modalSaveBtn'); if (sv) sv.style.display = '';
  const { error } = await sb.from('crews').update({ responsable: name || null }).eq('id', id);
  if (error) { toast('Erreur : ' + error.message, true); return; }
  const cr = (cache.crews||[]).find(x=>x.id===id); if (cr) cr.responsable = name || null;
  toast(name ? 'Attribué à ' + name : 'Attribution retirée');
  closeModal();
  renderCrews(document.getElementById('content'));
}

async function deleteCrew(id) {
  if (!confirm('Supprimer cet équipage ?')) return;
  const { error } = await sb.from('crews').delete().eq('id', id);
  if (error) { toast('Erreur', true); return; }
  toast('Équipage supprimé'); nav('crews');
}

function editCrew(id) {
  const cr = (cache.crews||[]).find(x=>x.id===id);
  if (!cr) return;
  openModal('crew', { ...cr, _editTitle: 'Modifier ' + cr.name });
}

function renderTeam(c) {
  const members = cache.team || [];
  // Grouper par pôle
  const groups = {};
  members.forEach(m => { const p = m.poste || 'Autres'; (groups[p] = groups[p] || []).push(m); });
  // Ordre : bureau d'abord, puis pôles alpha
  const bureau = ['Présidente','Vice-président','Trésorier'];
  const poleNames = Object.keys(groups).sort((a,b) => {
    const ia = bureau.indexOf(a), ib = bureau.indexOf(b);
    if (ia !== -1 || ib !== -1) return (ia===-1?99:ia) - (ib===-1?99:ib);
    return a.localeCompare(b);
  });
  const isAdmin = currentUser?.role === 'admin';
  c.innerHTML = poleNames.map(pole => {
    const list = groups[pole];
    const color = list[0].color || '#475569';
    return `<div class="pole-block" style="--pole-color:${color}">
      <div class="pole-header">
        <span class="pole-chip" style="background:${color}"></span>
        <span class="pole-title">${pole}</span>
        <span class="pole-count">${list.length}</span>
      </div>
      <div class="team-grid">${list.map(m=>`
        <div class="team-card" style="border-left:3px solid ${m.color||color}">
          <div class="avatar avatar-lg" style="background:${m.color||color}">${m.initials||m.name.slice(0,2).toUpperCase()}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:700">${m.name}</div>
            <div style="font-size:12px;color:var(--text3);overflow:hidden;text-overflow:ellipsis">${m.email}</div>
            <div style="margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
              <span class="badge ${m.role==='admin'?'badge-purple':'badge-gray'}">${m.role==='admin'?'Admin':'Membre'}</span>
              ${isAdmin?`<button class="btn" style="font-size:11px;padding:2px 8px" onclick="editMember('${m.id}')">Modifier</button>`:''}
            </div>
          </div>
        </div>`).join('')}</div>
    </div>`;
  }).join('');
}

      <div class="form-group full"><label class="form-label">Notes</label><textarea class="form-input" id="f-notes" rows="2">${prefill.notes||''}</textarea></div>
    </div>`;
    onSave = () => saveSponsor(prefill.id);
  } else if (type === 'member') {
    body = `<div class="form-grid">
      <div class="form-group"><label class="form-label">Prénom Nom *</label><input class="form-input" id="f-name" value="${prefill.name||''}"></div>
      <div class="form-group"><label class="form-label">Poste</label><input class="form-input" id="f-poste" value="${prefill.poste||''}"></div>
      <div class="form-group full"><label class="form-label">Email *</label><input class="form-input" id="f-email" type="email" value="${prefill.email||''}" placeholder="prenom.nom@dauphine.eu"></div>
      <div class="form-group"><label class="form-label">Rôle</label>
        <select class="form-select" id="f-role"><option value="membre" ${prefill.role==='membre'?'selected':''}>Membre</option><option value="admin" ${prefill.role==='admin'?'selected':''}>Admin</option></select>
      </div>
      <div class="form-group"><label class="form-label">Couleur</label>
        <select class="form-select" id="f-color">${[['#2563EB','Bleu'],['#059669','Vert'],['#7C3AED','Violet'],['#B45309','Ambre'],['#DC2626','Rouge'],['#6B7280','Gris']].map(([v,l])=>`<option value="${v}" ${prefill.color===v?'selected':''}>${l}</option>`).join('')}</select>
      </div>
    </div>`;
    onSave = () => saveMember(prefill.id);
  } else if (type === 'crew') {
    const respList = ['Anna','Honorine','Foulques','Anne','Noa','Mehdi','Autre'];
    body = `<div class="form-grid">
      <div class="form-group"><label class="form-label">Nom de l'équipage *</label><input class="form-input" id="f-name" value="${prefill.name||''}" placeholder="ex: SPI Barca"></div>
      <div class="form-group"><label class="form-label">Responsable SPI</label>
        <select class="form-select" id="f-responsable">${respList.map(r=>`<option ${prefill.responsable===r?'selected':''}>${r}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label class="form-label">Contact</label><input class="form-input" id="f-contact" value="${prefill.contact||''}" placeholder="@instagram ou tél"></div>
      <div class="form-group"><label class="form-label">Nb participants</label><input class="form-input" id="f-participants" value="${prefill.participants||''}" placeholder="ex: 20"></div>
      <div class="form-group"><label class="form-label">Bateau</label><input class="form-input" id="f-boat" value="${prefill.boat||''}" placeholder="oui / cherche / —"></div>
      <div class="form-group"><label class="form-label">Disponibilité</label><input class="form-input" id="f-availability" value="${prefill.availability||''}" placeholder="ex: en cours, vacances"></div>
      <div class="form-group full"><label class="form-label">Commentaire</label><textarea class="form-input" id="f-comment" rows="3">${prefill.comment||''}</textarea></div>
    </div>`;
    onSave = () => saveCrew(prefill.id);
  }

  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalSaveBtn').onclick = onSave;
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }

// ─── SAVE / EDIT / DELETE ────────────────────────────────────────────────────
async function saveProspect(id) {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('Le nom est requis', true); return; }
  const data = {
    name, sector: document.getElementById('f-sector').value,
    contact: document.getElementById('f-contact').value,
    email: document.getElementById('f-email').value,
    phone: document.getElementById('f-phone').value,
    status: document.getElementById('f-status').value,
    source: document.getElementById('f-source').value,
    notes: document.getElementById('f-notes').value,
    mail_status: document.getElementById('f-mail-status') ? document.getElementById('f-mail-status').value : undefined,
    last_action_at: new Date().toISOString()
  };
  if (id) {
    data.assignee_id = document.getElementById('f-assignee').value;
  } else {
    data.assignee_id = currentUser?.id || null;
  }
  if (data.mail_status === undefined) delete data.mail_status;
  const { error } = id ? await sb.from('prospects').update(data).eq('id', id) : await sb.from('prospects').insert(data);
  if (error) { toast('Erreur : ' + error.message, true); return; }
  toast(id ? 'Prospect mis à jour' : 'Prospect ajouté');
  closeModal();
  if (id) showProspect(id); else nav('prospects');
}

function editProspect(id) {
  const p = cache.prospects.find(x => x.id === id);
  if (!p) return;
  openModal('prospect', { ...p, assignee_id: p.assignee?.id, _editTitle: 'Modifier ' + p.name });
}

async function deleteProspect(id) {
  if (!confirm('Supprimer ce prospect ? Cette action est irréversible.')) return;
  const { error } = await sb.from('prospects').delete().eq('id', id);
  if (error) { toast('Erreur', true); return; }
  toast('Prospect supprimé');
  nav('prospects');
}

async function saveEvent(id) {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('Le nom est requis', true); return; }
  const data = {
    name, type: document.getElementById('f-type').value,
    date: document.getElementById('f-date').value,
    location: document.getElementById('f-location').value,
    budget: parseInt(document.getElementById('f-budget').value)||0,
    attendees: parseInt(document.getElementById('f-attendees').value)||0,
    description: document.getElementById('f-desc').value,
    status: 'planned'
  };
  const { error } = id ? await sb.from('events').update(data).eq('id', id) : await sb.from('events').insert(data);
  if (error) { toast('Erreur : ' + error.message, true); return; }
  toast(id ? 'Événement mis à jour' : 'Événement créé');
  closeModal(); nav('events');
}

async function saveSponsor(id) {
  const prospect_id = document.getElementById('f-prospect').value;
  if (!prospect_id) { toast('Sélectionne une entreprise', true); return; }
  const data = {
    prospect_id, package: document.getElementById('f-package').value,
    amount: parseInt(document.getElementById('f-amount').value)||0,
    status: document.getElementById('f-status').value,
    assignee_id: document.getElementById('f-assignee').value,
    notes: document.getElementById('f-notes').value
  };
  const { error } = id ? await sb.from('sponsors').update(data).eq('id', id) : await sb.from('sponsors').insert(data);
  if (error) { toast('Erreur : ' + error.message, true); return; }
  toast(id ? 'Sponsoring mis à jour' : 'Sponsoring ajouté');
  closeModal(); nav('sponsors');
}

async function saveMember(id) {
  const name = document.getElementById('f-name').value.trim();
  const email = document.getElementById('f-email').value.trim();
  if (!name || !email) { toast('Nom et email requis', true); return; }
  const initials = name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const data = {
    name, email, initials, poste: document.getElementById('f-poste').value,
    role: document.getElementById('f-role').value, color: document.getElementById('f-color').value
  };
  const { error } = id ? await sb.from('team').update(data).eq('id', id) : await sb.from('team').insert(data);
  if (error) { toast('Erreur : ' + error.message, true); return; }
  toast(id ? 'Membre mis à jour' : 'Membre ajouté');
  closeModal(); nav('team');
}

function editMember(id) {
  const m = cache.team.find(x => x.id === id);
  if (!m) return;
  openModal('member', { ...m, _editTitle: 'Modifier ' + m.name });
}

async function saveCrew(id) {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('Le nom est requis', true); return; }
  const data = {
    name,
    responsable: document.getElementById('f-responsable').value,
    contact: document.getElementById('f-contact').value,
    participants: document.getElementById('f-participants').value,
    boat: document.getElementById('f-boat').value,
    availability: document.getElementById('f-availability').value,
    comment: document.getElementById('f-comment').value
  };
  const { error } = id ? await sb.from('crews').update(data).eq('id', id) : await sb.from('crews').insert(data);
  if (error) { toast('Erreur : ' + error.message, true); return; }
  toast(id ? 'Équipage mis à jour' : 'Équipage ajouté');
  closeModal(); nav('crews');
}

// ─── ACTIONS ────────────────────────────────────────────────────────────────
function addAction(prospectId) {
  document.getElementById('modalTitle').textContent = 'Nouvelle action';
  document.getElementById('modalBody').innerHTML = `
  <div class="form-group"><label class="form-label">Type d'action</label>
    <select class="form-select" id="f-action-type">
      <option>Appel téléphonique</option><option>Email envoyé</option><option>Réunion</option>
      <option>Proposition envoyée</option><option>Relance</option><option>Autre</option>
    </select>
  </div>
  <div class="form-group" style="margin-top:12px"><label class="form-label">Note</label>
    <textarea class="form-input" id="f-action-note" rows="3" placeholder="Détails..."></textarea>
  </div>`;
  document.getElementById('modalSaveBtn').onclick = async () => {
    const { error } = await sb.from('actions').insert({
      prospect_id: prospectId,
      type: document.getElementById('f-action-type').value,
      note: document.getElementById('f-action-note').value,
      author_id: currentUser.id
    });
    if (!error) await sb.from('prospects').update({ last_action_at: new Date().toISOString() }).eq('id', prospectId);
    if (error) { toast('Erreur', true); return; }
    toast('Action enregistrée');
    closeModal(); showProspect(prospectId);
  };
  document.getElementById('modalOverlay').classList.add('show');
}

function changeStatus(id, current) {
  document.getElementById('modalTitle').textContent = 'Changer le statut';
  document.getElementById('modalBody').innerHTML = `
  <div class="form-group"><label class="form-label">Nouveau statut</label>
    <select class="form-select" id="f-new-status">${Object.entries({new:'Nouveau',contacted:'Contacté','in-process':'En cours',qualified:'Qualifié',negotiation:'Négociation','closed-won':'Signé','closed-lost':'Perdu'}).map(([v,l])=>`<option value="${v}" ${current===v?'selected':''}>${l}</option>`).join('')}</select>
  </div>`;
  document.getElementById('modalSaveBtn').onclick = async () => {
    const status = document.getElementById('f-new-status').value;
    await sb.from('prospects').update({ status, last_action_at: new Date().toISOString() }).eq('id', id);
    toast('Statut mis à jour');
    closeModal(); showProspect(id);
  };
  document.getElementById('modalOverlay').classList.add('show');
}

function changeMailStatus(id, current) {
  document.getElementById('modalTitle').textContent = 'Statut du mail';
  document.getElementById('modalBody').innerHTML = `
  <div class="form-group"><label class="form-label">Mail à envoyer ?</label>
    <select class="form-select" id="f-new-mail">${Object.entries({none:'Aucun','to-send':'À envoyer',sent:'Envoyé'}).map(([v,l])=>`<option value="${v}" ${current===v?'selected':''}>${l}</option>`).join('')}</select>
  </div>`;
  document.getElementById('modalSaveBtn').onclick = async () => {
    const mail_status = document.getElementById('f-new-mail').value;
    await sb.from('prospects').update({ mail_status }).eq('id', id);
    toast('Statut mail mis à jour');
    closeModal(); showProspect(id);
  };
  document.getElementById('modalOverlay').classList.add('show');
}

// ─── SEARCH ──────────────────────────────────────────────────────────────────
// ─── EXPORT EXCEL / PDF ──────────────────────────────────────────────────────
function getExportConfig(kind) {
  if (kind === 'crews') {
    return {
      title: 'Équipages SPI',
      headers: ['Équipage','Responsable','Contact','Participants','Bateau','Disponibilité','Commentaire'],
      rows: (cache.crews||[]).map(c => [c.name||'', c.responsable||'', c.contact||'', c.participants||'', c.boat||'', c.availability||'', c.comment||''])
    };
  }
  if (kind === 'prospects') {
    return {
      title: 'Entreprises & Prospects',
      headers: ['Entreprise','Secteur','Contact','Email','Téléphone','Statut','Source','Responsable'],
      rows: (cache.prospects||[]).map(p => [p.name||'', p.sector||'', p.contact||'', p.email||'', p.phone||'', statusLabels[p.status]||p.status||'', p.source||'', p.assignee?.name||''])
    };
  }
  if (kind === 'sponsors') {
    return {
      title: 'Sponsorings',
      headers: ['Entreprise','Package','Montant (€)','Statut','Livrables','Responsable','Notes'],
      rows: (cache.sponsors||[]).map(s => [s.prospect?.name||'', s.package||'', s.amount||0, statusLabels[s.status]||s.status||'', (s.deliverables||[]).join(', '), s.assignee?.name||'', s.notes||''])
    };
  }
  return null;
}

function exportData(kind, format) {
  const cfg = getExportConfig(kind);
  if (!cfg || !cfg.rows.length) { toast('Aucune donnée à exporter', true); return; }
  const dateStr = new Date().toLocaleDateString('fr-FR').replace(/\//g,'-');

  if (format === 'xlsx') {
    try {
      const aoa = [cfg.headers, ...cfg.rows];
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = cfg.headers.map((h,i) => ({ wch: Math.max(h.length, ...cfg.rows.map(r => String(r[i]||'').length)) + 2 }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, cfg.title.slice(0,31));
      XLSX.writeFile(wb, `SPI_${kind}_${dateStr}.xlsx`);
      toast('Export Excel téléchargé');
    } catch(e) { toast('Erreur export Excel', true); }
    return;
  }

  if (format === 'pdf') {
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: cfg.headers.length > 5 ? 'landscape' : 'portrait' });
      doc.setFontSize(16); doc.setTextColor(15,27,45);
      doc.text(cfg.title + ' — SPI Dauphine', 14, 18);
      doc.setFontSize(10); doc.setTextColor(120,130,150);
      doc.text('Généré le ' + new Date().toLocaleDateString('fr-FR') + ' · ' + cfg.rows.length + ' lignes', 14, 25);
      doc.autoTable({
        head: [cfg.headers], body: cfg.rows, startY: 30,
        styles: { fontSize: 8, cellPadding: 2.5, overflow: 'linebreak' },
        headStyles: { fillColor: [47,95,224], textColor: 255, fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [244,246,251] },
        margin: { left: 14, right: 14 }
      });
      doc.save(`SPI_${kind}_${dateStr}.pdf`);
      toast('Export PDF téléchargé');
    } catch(e) { toast('Erreur export PDF', true); }
    return;
  }
}

function onSearch(q) {
  if (currentView === 'crews') {
    const term = (q||'').toLowerCase();
    const tbodies = document.querySelectorAll('#content tbody tr');
    tbodies.forEach(tr => {
      tr.style.display = !term || tr.textContent.toLowerCase().includes(term) ? '' : 'none';
    });
    return;
  }
  if (currentView !== 'prospects') return;
  if (!q) { renderProspects(document.getElementById('content')); return; }
  q = q.toLowerCase();
  const filtered = cache.prospects.filter(p =>
    p.name?.toLowerCase().includes(q) ||
    p.contact?.toLowerCase().includes(q) ||
    p.sector?.toLowerCase().includes(q) ||
    p.email?.toLowerCase().includes(q)
  );
  renderProspects(document.getElementById('content'), filtered);
}
